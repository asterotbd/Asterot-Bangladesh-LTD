<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Portrait placeholder for Jaky All Naiem Jihan">
  <defs>
    <radialGradient id="bg" cx="35%" cy="22%" r="90%">
      <stop offset="0%" stop-color="#2a2a33"/>
      <stop offset="55%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#0a0a0e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="rgba(255,22,90,0.28)"/>
      <stop offset="55%" stop-color="rgba(255,22,90,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,22,90,0)"/>
    </radialGradient>
    <radialGradient id="ring" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FF2D6D"/>
      <stop offset="100%" stop-color="#7a0f2e"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <rect width="600" height="800" fill="url(#bg)"/>
  <rect width="600" height="800" fill="url(#dots)"/>
  <rect width="600" height="800" fill="url(#glow)"/>

  <circle cx="300" cy="350" r="148" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <circle cx="300" cy="350" r="132" fill="url(#face)" stroke="url(#ring)" stroke-width="2"/>
  <circle cx="300" cy="350" r="132" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="10"/>

  <text x="300" y="385" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="104" font-weight="700" letter-spacing="2" fill="rgba(255,255,255,0.92)">JJ</text>

  <rect x="232" y="452" width="136" height="3" rx="1.5" fill="#FF165A"/>

  <text x="300" y="510" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="0.5" fill="rgba(255,255,255,0.85)">Jaky All Naiem Jihan</text>
  <text x="300" y="546" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="4" fill="rgba(255,255,255,0.45)">CHAIRMAN</text>

  <text x="300" y="766" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="6" fill="rgba(255,255,255,0.18)">ASTEROT</text>
